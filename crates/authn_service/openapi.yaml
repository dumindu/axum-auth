openapi: 3.1.0
info:
  title: Authn Service API
  description: ''
  license:
    name: ''
  version: 1.0.0
servers:
- url: http://localhost:3000
  description: Development
paths:
  /v1/login:
    post:
      tags:
      - auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: A successful login
          headers:
            Set-Cookie:
              schema:
                type: string
              description: |-
                Returns two cookies:
                1. refresh_token; Secure;HTTP-only;session cookie;Max-Age=7days
                2. device_id; Secure;HTTP-only;Max-Age=90days
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: An invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: An invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A forbidden request
        '422':
          description: An unprocessable payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: An internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/logout:
    post:
      tags:
      - auth
      operationId: logout
      responses:
        '200':
          description: A successful logout
          headers:
            Set-Cookie:
              schema:
                type: string
              description: refresh_token; Secure;HTTP-only;session cookie;Max-Age=-2days
        '401':
          description: unauthorized request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: An internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - jwt_token: []
  /v1/register:
    post:
      tags:
      - auth
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
        required: true
      responses:
        '201':
          description: A successful registration
        '400':
          description: An invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: A forbidden request
        '409':
          description: A duplicate entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: An unprocessable payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: An internal failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Error:
      type: string
      enum:
      - DB_TX_BEGIN_FAILED
      - DB_TX_COMMIT_FAILED
      - DB_INSERT_FAILED
      - DB_FETCH_FAILED
      - DB_UPDATE_FAILED
      - DB_DELETE_FAILED
      - CACHE_SET_FAILED
      - CACHE_EXISTS_FAILED
      - PASSWORD_HASH_CONTEXT_FAILED
      - PASSWORD_HASH_ACTION_FAILED
      - JWT_GEN_FAILED
      - TIME_GEN_FAILED
      - MSG_GEN_FAILED
      - MSG_PUB_FAILED
      - MSG_ACK_FAILED
      - INVALID_GRANT
      - INVALID_CREDENTIALS
      - INVALID_REFRESH_TOKEN
      - INVALID_TOKEN
      - INVALID_TOKEN_ISSUER
      - INVALID_TOKEN_AUDIENCE
      - NOT_YET_VALID_TOKEN
      - EXPIRED_TOKEN
      - BLACKLISTED_TOKEN
      - DUPLICATE_ENTITY
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
      examples:
      - '{"error": "DB_FETCH_FAILED"}'
    LoginRequest:
      type: object
      required:
      - email
      - password
      - device_name
      properties:
        device_name:
          type: string
          examples:
          - iPhone 18 Pro
          maxLength: 255
          minLength: 5
        email:
          type: string
          examples:
          - user@mail.com
        password:
          type: string
          examples:
          - P@ssword123!
          maxLength: 128
          minLength: 12
    LoginResponse:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          format: int64
        token_type:
          type: string
    RegistrationRequest:
      type: object
      required:
      - email
      - password
      - password_confirm
      properties:
        email:
          type: string
          examples:
          - user@mail.com
        password:
          type: string
          examples:
          - P@ssword123!
          maxLength: 128
          minLength: 12
        password_confirm:
          type: string
          examples:
          - P@ssword123!
          maxLength: 128
          minLength: 12
    ValidationErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: object
          additionalProperties:
            type: string
          propertyNames:
            type: string
      examples:
      - '{ "errors": { "image_url": "Must be a valid URL", "title": "Must be at least 1 character long" } }'
