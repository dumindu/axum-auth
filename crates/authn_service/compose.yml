services:
  app:
    image: authn-service-app
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        workspace_root: ../..
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      nats:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: [ "sh", "-c", "/service/migration migration apply && /service/app" ]

  db:
    image: postgres:18-alpine
    container_name: authn-service-db
    environment:
      POSTGRES_DB: authn-service-db
      POSTGRES_USER: authn-service-user
      POSTGRES_PASSWORD: authn-service-pass
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U authn-service-user -d authn-service-db" ]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: always

  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: authn-service-cache
    volumes:
      - ./.docker/dragonfly:/data
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli", "-a", "ping" ]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: always

  nats:
    image: nats:2-alpine
    container_name: authn-service-nats
    command: [ "-c", "/etc/nats/nats-server.conf", "-m", "8222" ]
    volumes:
      - ./nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./.docker/nats:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: [ "CMD", "wget", "http://localhost:8222/healthz" ]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: always
