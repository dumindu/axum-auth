services:
  worker:
    image: authn-worker-notify
    container_name: authn-worker-notify
    restart: on-failure
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        workspace_root: ../..
    depends_on:
      mail:
        condition: service_healthy
    networks:
      - authn_service_default

  mail:
    image: axllent/mailpit:latest
    container_name: authn-worker-notify-mail
    restart: unless-stopped
    volumes:
      - ./.docker/mailpit:/data
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_TLS_CERT: sans:localhost
      MP_SMTP_TLS_KEY: sans:localhost
      MP_SMTP_AUTH: user:password
      MP_SMTP_REQUIRE_STARTTLS: false
    networks:
      - authn_service_default

networks:
  authn_service_default:
    external: true
